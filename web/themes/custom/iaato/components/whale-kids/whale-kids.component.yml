$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Whale tracker: kids'
description: 'Playful animated whale map for young children: big buttons, cartoon whales, simple facts.'
group: IAATO
status: experimental
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - iaato/whale-common
    - iaato/font-fredoka
props:
  type: object
  required: [data_url]
  properties:
    heading:
      type: string
      title: Heading
      examples: ['Where are the whales?']
    view:
      type: string
      title: Map view
      enum: [peninsula, circumpolar]
      meta:enum:
        peninsula: 'Peninsula close-up'
        circumpolar: 'Whole Antarctica (circumpolar)'
      default: peninsula
      examples: [peninsula]
    data_url:
      type: string
      title: Tracking data URL
      description: 'JSON feed of tag fixes. See js/whale-common.js normalize() for accepted shapes.'
      format: uri-reference
      examples: ['/themes/custom/iaato/data/whale-tracks.json']
